name: Production drift

# Hourly: is api-prod running what main says it should? (KAN-180)
#
# Nothing deploys on merge, and until this nothing noticed when production fell
# behind — twice in one week an integrator was blocked on a fix that was merged,
# green and simply not deployed. This makes the owed deploy visible: a red run
# and a single tracking issue that closes itself once production catches up.
#
# It holds NO production credentials. It reads the public /v1/health endpoint,
# where the API reports its build SHA, and compares that to git history. The
# only permission it needs beyond reading the repo is managing that one issue.
# A drift check able to deploy would be a far larger thing to trust than one
# that can only look.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-drift
  cancel-in-progress: false

jobs:
  check:
    name: ${{ matrix.service }} vs main
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-prod
            health_url: https://api-prod-1098891924957.me-west1.run.app/v1/health
          # api-preprod writes to the same Firestore and warehouse as api-prod (KAN-207), so
          # an old build there corrupts production data just as surely - it silently dropped
          # entity updates on 2026-09-25 while running an untracked build.
          - service: api-preprod
            health_url: https://api-preprod-5u3ypal2gq-zf.a.run.app/v1/health
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # `git log A..B` on a shallow clone reports nothing, which would read
          # as "production is current". Full history or the check lies.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build the drift logic
        run: |
          pnpm install --frozen-lockfile --filter @growthos/shared...
          pnpm --filter @growthos/shared build

      - name: Compare ${{ matrix.service }} with main
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE_NAME: ${{ matrix.service }}
          PROD_HEALTH_URL: ${{ matrix.health_url }}
        run: node scripts/deploy/check-prod-drift.mjs
