name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Firebase emulator JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Cache dbt-transform virtualenv
        uses: actions/cache@v4
        with:
          path: packages/dbt-transform/.venv
          key: dbt-transform-venv-${{ runner.os }}-${{ hashFiles('packages/dbt-transform/requirements.txt') }}

      - name: Install Playwright browsers
        run: pnpm --filter @growthos/web exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  terraform:
    name: terraform fmt · validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      # No GCP credentials in CI — every resource here already exists in the
      # real project and is meant to be imported, not applied fresh (see
      # infra/terraform/README.md). This only proves the HCL is valid, not
      # that it matches reality.
      - name: Init (no backend, no credentials)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
