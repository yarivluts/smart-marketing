name: CI

# `pull_request` deliberately carries no `branches:` filter, and names `edited`
# among its types. Both matter, and this repo was paying for neither (KAN-163).
#
# `branches: [main]` filters on the PR's BASE, so a PR stacked on another
# branch matched nothing and got no CI at all — not a pending check, not a
# failing one, but an empty checks list, which in `gh pr list` output is
# indistinguishable from a green one. Three PRs merged that way in one
# afternoon.
#
# `edited` is what fires when a PR's base branch changes. It is not in the
# default set (`opened`, `synchronize`, `reopened`), so retargeting a stacked
# PR onto `main` — the standard way to unstack before merging — still left it
# with no CI, and nothing said so.
#
# Stacked PRs are normal here: a page review sits on the previous one whenever
# both touch `apps/web/messages`. Running CI on every PR costs a few minutes
# per branch; not running it costs a merge to `main` nobody checked.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Firebase emulator JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Cache dbt-transform virtualenv
        uses: actions/cache@v4
        with:
          path: packages/dbt-transform/.venv
          key: dbt-transform-venv-${{ runner.os }}-${{ hashFiles('packages/dbt-transform/requirements.txt') }}

      - name: Install Playwright browsers
        run: pnpm --filter @growthos/web exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  terraform:
    name: terraform fmt · validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      # No GCP credentials in CI — every resource here already exists in the
      # real project and is meant to be imported, not applied fresh (see
      # infra/terraform/README.md). This only proves the HCL is valid, not
      # that it matches reality.
      - name: Init (no backend, no credentials)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
