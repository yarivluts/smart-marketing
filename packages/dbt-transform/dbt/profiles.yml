# Buildable-today warehouse stand-in (same posture as the rest of this
# codebase's provider-agnostic seams — LocalKmsProvider, InMemoryTokenBucketRateLimiter,
# NotConfiguredWarehouseQueryExecutor): dbt-duckdb runs this project against a local,
# file-based DuckDB database seeded from a fixture "test dataset" (seeds/raw_records.csv),
# so `dbt build` is real and green in CI without a live BigQuery project. `dev` (DuckDB)
# stays the default target CI actually builds against; `prod` (below) is the real
# BigQuery leg (KAN-18 phase 4) — every model/macro compiles unchanged against either
# adapter (see macros/cross_database.sql).
#
# `prod` HAS been provisioned and run: the `growthos_core` dataset in growthos-g2w84
# holds the built models (entities, events, measures, bridge_identity, stg_* and the
# fact_* tables), and `api-prod` sets the warehouse env vars so the runtime query
# executor targets it. This comment previously said prod was inert, needed a human, and
# had never run against a live BigQuery project; that was true when written and is not
# now. It matters because the two targets are not equivalent — see
# `stg_identity_key_observations`, whose DuckDB leg joins the registered-identity-key
# seed while its BigQuery leg uses fixed envelope paths — so believing dev is the only
# live leg leads to reasoning about behaviour production does not have.
growthos_transform:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'target/growthos_transform.duckdb'
      threads: 4
    prod:
      type: bigquery
      method: oauth
      # Same project-id env vars `@google-cloud/bigquery`/this repo's own
      # BigQueryWarehouseQueryExecutor already read (packages/firebase-orm-models/src/
      # warehouse/query-executor.ts) — one project id, recognized either way.
      project: "{{ env_var('GOOGLE_CLOUD_PROJECT', env_var('GCLOUD_PROJECT', '')) }}"
      # The `growthos_core` dataset (infra/terraform/bigquery.tf) this project's own
      # `core`-schema models (entities/events/measures/bridge_identity/fact_*) write
      # into — same env var the query executor reads.
      dataset: "{{ env_var('GROWTHOS_BIGQUERY_CORE_DATASET', 'growthos_core') }}"
      location: "{{ env_var('GROWTHOS_BIGQUERY_LOCATION', 'US') }}"
      threads: 4
