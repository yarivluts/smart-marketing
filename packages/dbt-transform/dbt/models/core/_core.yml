version: 2

models:
  - name: entities
    description: >
      Canonical entity current-state table (plan `04 §1`'s `dim_*` tables,
      generalized): latest-landed payload per (org, project, environment,
      schema, entity id) — environment joined the grain 2026-08-19 so a
      test-mode and live-mode entity sharing a client_id stop deduping
      against each other (see the model's own comment).
    columns:
      - name: entity_key
        description: Surrogate over (organization_id, project_id, environment_id, schema_name, entity_id).
        tests:
          - not_null
          - unique
      - name: environment_id
        tests:
          - not_null
      - name: entity_id
        tests:
          - not_null
      - name: last_seen_at
        tests:
          - not_null

  - name: events
    description: >
      Canonical event fact table (plan `04 §1`'s `fact_funnel_event`,
      generalized): append-only, one row per landed event.
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: occurred_at
        tests:
          - not_null

  - name: measures
    description: >
      Canonical measure fact table (plan `04 §1`'s `fact_ad_spend`-shaped
      tables, generalized): append-only, one row per landed pre-aggregated
      measure.
    columns:
      - name: measure_id
        tests:
          - not_null
          - unique

  - name: bridge_identity
    description: >
      Deterministic identity stitching (plan `04 §4`, KAN-56): one row per
      resolved anon_id -> customer_id link, with the winning method,
      confidence, and a conflict flag — see the model's own doc comment for
      the full conflict-resolution rule.
    columns:
      - name: bridge_identity_key
        description: Composite (project_id, environment_id, anon_id) uniqueness key.
        tests:
          - not_null
          - unique
      - name: anon_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: method
        tests:
          - not_null
      - name: confidence
        tests:
          - not_null
      - name: is_conflicted
        tests:
          - not_null

  - name: fact_attribution
    description: >
      Rules-based attribution (plan `04 §4`, KAN-58): first-touch and
      last-touch credit for every customer-side ("conversion") event,
      resolved back through `bridge_identity` to the touchpoints that
      preceded it — see the model's own doc comment for the full rule.
    columns:
      - name: attribution_key
        description: Composite (project_id, environment_id, conversion_event_id, model) uniqueness key.
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: conversion_event_id
        tests:
          - not_null
      - name: conversion_event
        tests:
          - not_null
      - name: model
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['first_touch', 'last_touch']
      - name: channel_id
        tests:
          - not_null
      - name: landing_page
        description: >
          The crediting touchpoint's captured entry URL, or null when that
          touchpoint carried none (and always null for `unattributed`
          rows). Deliberately not coalesced here — see the model's doc comment.
      - name: credit
        tests:
          - not_null

  - name: fact_cohort_retention
    description: >
      Generic cohort engine v1 (plan `04 §5`, KAN-62): one row per
      (cohort_month, period_number) — every customer's cohort is the
      calendar month of their first customer-side event; `retention_rate`
      is the fraction of that cohort still active `period_number` months
      later. Feeds the KAN-60 `heatmap` board tile. See the model's own doc
      comment for the full periods/observability rule.
    columns:
      - name: cohort_retention_key
        description: Composite (project_id, environment_id, cohort_month, period_number) uniqueness key.
        tests:
          - not_null
          - unique
      - name: cohort_month
        tests:
          - not_null
      - name: period_number
        tests:
          - not_null
      - name: cohort_size
        tests:
          - not_null
      - name: retained_count
        tests:
          - not_null
      - name: retention_rate
        tests:
          - not_null

  - name: fact_engagement_daily
    description: >
      Daily engagement (plan `04 §3`/`14` gap 2, KAN-63): one row per
      (project, environment, activity_date) — `dau` that day, the trailing
      `engagement_window_days`-day (default 28) distinct active-customer
      count, and their ratio (`dau_mau_ratio`, the stickiness metric). Feeds
      the engagement-pack's own `dau_mau_ratio` metric. See the model's own
      doc comment for why `dau`/`wau`/`mau` themselves come from a different,
      aspirational metric definition instead of this table.
    columns:
      - name: engagement_daily_key
        description: Composite (project_id, environment_id, activity_date) uniqueness key.
        tests:
          - not_null
          - unique
      - name: activity_date
        tests:
          - not_null
      - name: dau
        tests:
          - not_null
      - name: active_customers_l_n
        tests:
          - not_null
      - name: dau_mau_ratio
        tests:
          - not_null

  - name: fact_engagement_depth_histogram
    description: >
      The L28/LN engagement-depth histogram (plan `14` gap 2, KAN-63): one
      row per (project, environment, as_of_date, days_active_bucket) — how
      many customers were active on exactly that many of the trailing
      `engagement_window_days` days, as of the project's own latest observed
      activity date. Feeds the KAN-60 `histogram` board tile via the
      engagement-pack's own `engagement_depth_histogram` metric.
    columns:
      - name: engagement_depth_histogram_key
        description: Composite (project_id, environment_id, as_of_date, days_active_bucket) uniqueness key.
        tests:
          - not_null
          - unique
      - name: as_of_date
        tests:
          - not_null
      - name: days_active_bucket
        tests:
          - not_null
      - name: customer_count
        tests:
          - not_null

  - name: fact_funnel_step
    description: >
      Step-conversion funnel (plan `04 §1`'s `fact_funnel_event`,
      generalized; KAN-75's `query_funnel` follow-up): one row per
      (customer, funnel stage) the customer ever reached, against a
      human-confirmed funnel (`funnel_step_mappings`, standing in for
      KAN-68's onboarding-wizard `OnboardingStateModel.funnel_steps`
      export). Feeds the `query_funnel` MCP tool. See the model's own doc
      comment for the full label-derivation and grain rules.
    columns:
      - name: funnel_step_key
        description: Composite (project_id, environment_id, customer_id, stage_key) uniqueness key.
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: stage_key
        tests:
          - not_null
      - name: step_order
        tests:
          - not_null
      - name: reached_at
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null

  - name: fact_funnel_event
    description: >
      Generic funnel-event fact (plan `04 §1`, 2026-08-21 KAN-59 follow-up):
      append-only, one row per non-touchpoint event, labeled by the
      payload's own `event_name` (falling back to `event_type`). Feeds the
      SaaS pack's `signups` metric and the engagement pack's `dau`/`wau`/
      `mau`. See the model's own doc comment for how this differs from
      `fact_funnel_step`.
    columns:
      - name: funnel_event_key
        description: Composite (project_id, environment_id, event_id) uniqueness key.
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: step
        tests:
          - not_null
      - name: ts
        tests:
          - not_null

  - name: dim_subscription
    description: >
      Subscription dimension (plan `04 §1`, 2026-08-21 KAN-59 follow-up):
      current-state snapshot per Stripe subscription (KAN-49). Feeds the
      SaaS pack's `mrr`/`trials_active` metrics.
    columns:
      - name: subscription_key
        description: Surrogate over (organization_id, project_id, environment_id, schema_name, subscription_id) — inherited from `entities.entity_key`.
        tests:
          - not_null
          - unique
      - name: subscription_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'trialing', 'past_due', 'canceled', 'unpaid', 'incomplete', 'incomplete_expired', 'paused']
      - name: started_at
        tests:
          - not_null

  - name: fact_subscription_event
    description: >
      Subscription lifecycle-transition fact (plan `04 §1`, 2026-08-21
      KAN-59 follow-up): one row per detected trial_start/convert/
      reactivate transition, derived by diffing consecutive landed
      subscription snapshots. Feeds the SaaS pack's `reactivations`/
      `trial_starts`/`trial_conversions` metrics. See
      `stg_stripe_subscription_history`'s own doc comment for the exact
      transition rules.
    columns:
      - name: subscription_event_key
        tests:
          - not_null
          - unique
      - name: subscription_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['trial_start', 'convert', 'reactivate']
      - name: ts
        tests:
          - not_null

  - name: fact_revenue_event
    description: >
      Revenue event fact (plan `04 §1`, 2026-08-21 KAN-59 follow-up): one
      row per dollar-denominated commerce event — a Stripe charge outcome
      (`charge`/`first_charge`) or a subscription MRR movement (`new`/
      `upgrade`/`downgrade`). Feeds the SaaS pack's `mrr_movements`/
      `expansion_mrr`/`churned_mrr`/`collected_revenue`/`total_charges`/
      `failed_charges`/`attributed_gross_profit`/`new_paying` metrics. See
      the model's own doc comment for which columns are populated for which
      `type`.
    columns:
      - name: revenue_event_key
        description: Composite (project_id, environment_id, revenue_event_id, type) uniqueness key.
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['charge', 'first_charge', 'new', 'upgrade', 'downgrade']
      - name: ts
        tests:
          - not_null

  - name: fact_landing_page_performance
    description: >
      Visitors and last-touch attributed conversions per
      (day x landing page x campaign x channel) — the grain a
      "which landing page converts best in which campaign?" board queries.
      See the model's own doc comment for why conversions are last-touch
      only, and for the conversion-time dating caveat on short ranges.
    columns:
      - name: landing_page_performance_key
        description: Composite (org, project, env, activity_date, landing_page, campaign_id, channel_id) uniqueness key.
        tests:
          - not_null
          - unique
      - name: organization_id
        tests:
          - not_null
      - name: project_id
        tests:
          - not_null
      - name: environment_id
        tests:
          - not_null
      - name: activity_date
        tests:
          - not_null
      - name: landing_page
        tests:
          - not_null
      - name: campaign_id
        tests:
          - not_null
      - name: channel_id
        tests:
          - not_null
      - name: visitors
        tests:
          - not_null
      - name: conversions
        tests:
          - not_null

  - name: fact_survey_response
    description: >
      Flattened survey-response fact (KAN-82, plan `14 §Gap 1`): one row per
      landed `survey_response` event, with the payload's `score`/
      `survey_type` pulled out into real columns so the metrics compiler
      (which only ever emits bare column references, never generic JSON
      extraction) can filter/aggregate NPS promoter/detractor counts. Feeds
      the Feedback pack's `nps_respondents`/`nps_promoters`/
      `nps_detractors`/`nps_score` metrics.
    columns:
      - name: survey_response_key
        description: Composite (project_id, environment_id, event_id) uniqueness key.
        tests:
          - not_null
          - unique
      - name: survey_type
        tests:
          - not_null
      - name: ts
        tests:
          - not_null

  - name: fact_customer_payback
    description: >
      Fixed-window payback (KAN-86, plan `14 §Gap 12`): one row per customer,
      with revenue collected within 7/14/30/40 days of that customer's own
      acquisition (first customer-side event). Feeds the Campaign Ops pack's
      `collection_7d`/`collection_14d`/`collection_30d`/`collection_40d`
      metrics — project-level cohort payback, not per-campaign yet (see the
      model's own doc comment for why).
    columns:
      - name: customer_payback_key
        description: Composite (project_id, environment_id, customer_id) uniqueness key.
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: acquired_at
        tests:
          - not_null
      - name: collected_revenue_7d
        tests:
          - not_null
      - name: collected_revenue_40d
        tests:
          - not_null

  - name: fact_cancellation_reason
    description: >
      Churn-reason capture (KAN-84, plan `14 §Gap 10`): one row per landed
      `cancellation_reason` event, with the payload's structured `reason_code`
      + free-text `comment` pulled into real columns and joined to the
      customer's current subscription plan, last-touch marketing channel,
      and signup cohort month. Feeds the Churn Reason pack's
      `cancellations_total` metric, broken down by any of those three
      dimensions plus `reason_code` itself.
    columns:
      - name: cancellation_reason_key
        description: Composite (project_id, environment_id, event_id) uniqueness key.
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: reason_code
        tests:
          - not_null
      - name: ts
        tests:
          - not_null

  - name: fact_signup_quality_score
    description: >
      Intent/quality scoring (KAN-83, plan `14 §Gap 4`): one row per landed
      `onboarding_survey` event, with the payload's structured
      `company_size`/`budget_range`/`urgency` answers and the already-computed
      `quality_score` pulled into real columns and joined to the customer's
      last-touch marketing channel, signup cohort month, and whether they've
      ever become a paying customer. Feeds the Intent & Quality pack's
      `avg_signup_quality_score`/`quality_adjusted_cost_per_signup`/
      `quality_adjusted_cac` metrics.
    columns:
      - name: signup_quality_score_key
        description: Composite (project_id, environment_id, event_id) uniqueness key.
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: is_paying_customer
        tests:
          - not_null
          - accepted_values:
              values: ['true', 'false']
      - name: ts
        tests:
          - not_null

  - name: fact_company_firmographic
    description: >
      Firmographic enrichment (KAN-87, plan `14 §Gap 11`): one row per landed
      `company_firmographic` event, with its self-reported
      `company_name`/`company_domain`/`employee_count_range`/`region` and its
      client-computed `industry` (`classifyCompanyIndustry`,
      `@growthos/shared`'s buildable-today AI-industry-classification
      stand-in) pulled into real columns, joined to the customer's current
      subscription MRR. Feeds the Firmographic Enrichment pack's
      `firmographic_profiles_total` (count) and `firmographic_mrr_total`
      (sum) metrics, broken down by industry/employee-count-range/region for
      the "# vs $" composition dashboard the AC names.
    columns:
      - name: company_firmographic_key
        description: Composite (project_id, environment_id, event_id) uniqueness key.
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: industry
        tests:
          - not_null
      - name: ts
        tests:
          - not_null

  - name: fact_quality_calibration
    description: >
      Predicted-vs-actual calibration (KAN-86, plan `14 §Gap 12`): one row
      per scored `onboarding_survey` event (KAN-83's `fact_signup_quality_score`),
      joined to that customer's fixed-window payback (`fact_customer_payback`)
      and bucketed into a `quality_tier` (low/medium/high, reusing
      `signupQualityScoreTier`'s exact 0-100 thresholds). Feeds the Campaign
      Ops pack's `quality_calibration_signups`/`quality_calibration_paying`/
      `quality_calibration_collected_revenue_40d` metrics, broken down by
      `quality_tier` for the "does a high-scored signup actually pay more"
      calibration view.
    columns:
      - name: quality_calibration_key
        description: Composite (project_id, environment_id, customer_id, ts) uniqueness key.
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: quality_tier
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high']
      - name: is_paying_customer
        tests:
          - not_null
          - accepted_values:
              values: ['true', 'false']
      - name: collected_revenue_40d
        tests:
          - not_null
      - name: ts
        tests:
          - not_null
