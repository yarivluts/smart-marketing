name: 'growthos_transform'
version: '1.0.0'
config-version: 2

profile: 'growthos_transform'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"

seeds:
  growthos_transform:
    +schema: seed
    # Seeds are DuckDB-only fixture stand-ins (see each seed's own .yml
    # description): on a real BigQuery target, raw records come from the
    # actual `growthos_raw.raw_records` source table (stg_raw_records
    # switches at compile time) and the identity-fields export doesn't exist
    # yet (documented follow-up). Loading them into BigQuery also fails
    # outright — `+column_types` below are DuckDB type names (VARCHAR),
    # which BigQuery rejects — as the first real `dbt build --target prod`
    # (2026-08-19) proved.
    +enabled: "{{ (target.type == 'duckdb') | as_bool }}"
    raw_records:
      +column_types:
        organization_id: VARCHAR
        project_id: VARCHAR
        environment_id: VARCHAR
        partition_date: DATE
        batch_id: VARCHAR
        kind: VARCHAR
        schema_name: VARCHAR
        client_id: VARCHAR
        payload: JSON
        landed_at: TIMESTAMP
    schema_identity_fields:
      +column_types:
        organization_id: VARCHAR
        project_id: VARCHAR
        kind: VARCHAR
        schema_name: VARCHAR
        field_name: VARCHAR
    funnel_step_mappings:
      +column_types:
        organization_id: VARCHAR
        project_id: VARCHAR
        event_label: VARCHAR
        stage_key: VARCHAR
        step_order: INTEGER

models:
  growthos_transform:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
