version: 2

seeds:
  - name: raw_records
    description: >
      Fixture "test dataset" standing in for a real export of KAN-33's
      Firestore `raw_records` collection (itself a stand-in for a partitioned
      BigQuery raw table until KAN-18 provisions one) — enough rows across
      three projects/environments and all three schema kinds to build and
      test the staging/core layers against. `proj_2`'s rows are a synthetic
      anon -> signup -> purchase identity journey (KAN-56's
      `bridge_identity`), not a third unrelated tenant. `proj_10`'s rows are
      a synthetic two-channel touchpoint journey (KAN-58's
      `fact_attribution`: a paid-search touchpoint followed by a paid-social
      one, both resolved to the same customer via a shared device id) —
      isolated from `proj_2`'s own exact-row-count-asserting bridge_identity
      fixture test. `proj_11`'s rows are a synthetic two-cohort signup →
      retention journey (KAN-62's `fact_cohort_retention`: a January cohort
      of 3 customers and a February cohort of 2, with hand-picked return
      activity spanning January–March) — isolated from every other
      project's own exact-row-count-asserting fixture test. `proj_12`'s rows
      are a synthetic 28-day engagement window (KAN-63's `fact_engagement_
      daily`/`fact_engagement_depth_histogram`: four customers with
      deliberately distinct activity-day counts — 10/3/1/6 out of the
      2026-04-01..2026-04-28 window — so both the daily DAU/stickiness table
      and the days-active histogram have hand-computable, mutually distinct
      expected values) — isolated the same way. `proj_13`'s rows are a
      synthetic Stripe subscription/charge history (2026-08-21 KAN-59
      follow-up: `dim_subscription`/`fact_subscription_event`/`fact_revenue_
      event`) — three subscriptions' full snapshot histories (`sub_1301`:
      trial -> convert -> upgrade -> cancel; `sub_1302`: new -> cancel ->
      reactivate; `sub_1303`: new -> past_due -> reactivate, covering the
      "reactivation from a non-canceled status" branch a canceled-only
      fixture wouldn't exercise) plus four charges (two customers, one
      failed charge) — isolated the same way. `proj_14`'s rows are a
      synthetic NPS survey-response journey (KAN-82: `fact_survey_response`)
      — six landed responses (promoters: 10, 9, 9; passive: 8; detractor: 4;
      plus one malformed response with no `score` field, exercising
      `growthos_try_cast`'s null-on-failure tolerance) — isolated the same
      way. `proj_15`'s rows are a synthetic churn-reason journey (KAN-84:
      `fact_cancellation_reason`) — one customer with a captured touchpoint,
      a signup, and an active subscription before cancelling (exercising the
      plan/channel/cohort joins all landing on real values), and a second
      customer who cancels with no subscription or touchpoint ever landed
      (exercising the left joins' null-on-missing-dimension tolerance) —
      isolated the same way. `proj_19`'s rows are a second, dimension-focused
      NPS journey (KAN-82 follow-up: `fact_survey_response`'s
      `plan_interval`/`channel_id`/`cohort_month` breakdown columns) — one
      customer with a captured touchpoint, a signup, and an active annual
      subscription before responding (exercising the plan/channel/cohort
      joins all landing on real values), and a second customer who responds
      with no subscription or touchpoint ever landed (exercising the left
      joins' null-on-missing-dimension tolerance, same posture `proj_15`
      established) — isolated from `proj_14`'s own exact-category-count-
      asserting fixture test. `proj_20`'s rows are a synthetic A/B
      experiment journey (KAN-89: `fact_experiment_event`) — one
      `lp_headline_v2` experiment with two `control` visitors (one who
      converts, one who doesn't) and two `treatment` visitors (both
      convert) — exercising the mart's exposure/conversion flattening
      with a hand-computable, deliberately asymmetric expected count per
      (event_type, variant_key) — isolated the same way.
    columns:
      - name: organization_id
        tests:
          - not_null
      - name: project_id
        tests:
          - not_null
      - name: environment_id
        tests:
          - not_null
      - name: kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['entity', 'event', 'measure']
      - name: schema_name
        tests:
          - not_null
      - name: client_id
        tests:
          - not_null
      - name: landed_at
        tests:
          - not_null
