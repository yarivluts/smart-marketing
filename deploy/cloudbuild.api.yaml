# Builds the GrowthOS API image from the monorepo root and pushes it to Artifact Registry.
# Usage: gcloud builds submit --config deploy/cloudbuild.api.yaml #          --substitutions _IMAGE=<image>,_GIT_SHA=<commit> .
#
# _GIT_SHA is stamped into the image and reported on /v1/health, which is what
# lets .github/workflows/prod-drift.yml notice production falling behind main
# (KAN-180). Omit it and the API reports `buildSha: null` — honest, but the
# drift check then cannot tell how far behind production is.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '--build-arg', 'GIT_SHA=${_GIT_SHA}', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  machineType: 'E2_HIGHCPU_8'
timeout: 1800s
substitutions:
  _GIT_SHA: ''
