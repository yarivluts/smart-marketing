# Builds the scheduled warehouse-refresh (dbt) runner image from the monorepo
# root and pushes it to Artifact Registry — see packages/dbt-transform/Dockerfile.
# Usage: gcloud builds submit --config deploy/cloudbuild.dbt.yaml --substitutions _IMAGE=<image> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'packages/dbt-transform/Dockerfile', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  machineType: 'E2_HIGHCPU_8'
timeout: 900s
