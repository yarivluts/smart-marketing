# Builds the scheduled warehouse-refresh (dbt) runner image from the monorepo
# root and pushes it to Artifact Registry — see packages/dbt-transform/Dockerfile.
# Usage:
#   gcloud builds submit --config deploy/cloudbuild.dbt.yaml \
#     --substitutions _IMAGE=<image>,_GIT_SHA=<commit> .
#
# _GIT_SHA is stamped into the image; every run of the dbt-refresh job records it
# in the `dbt_build_info` table, and api-prod reports it on /v1/health/dbt-refresh,
# which is what lets .github/workflows/prod-drift.yml notice the job running an
# old image (KAN-204). Omit it and the job records NULL - honest, but the drift
# check then cannot tell how far behind the job is.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'packages/dbt-transform/Dockerfile', '--build-arg', 'GIT_SHA=${_GIT_SHA}', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  machineType: 'E2_HIGHCPU_8'
timeout: 900s
substitutions:
  _GIT_SHA: ''
